<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>ZRC OS</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#060D18; color:#5A6A80;
    font:10px/1.8 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing:1.4px; text-align:center; padding:24px; }
  a { color:#C9A84C; }
</style>
</head>
<body>
<p>ZRC OS VIVE AHORA EN LA PORTADA.<br />REDIRIGIENDO&hellip;<br /><br />
   <a href="/" id="ir">IR A ZRC OS</a></p>
<script>
// El enlace magico de Supabase devuelve el token en el fragmento (#access_token=...)
// y los filtros pueden venir en la query. Se conservan los dos: perderlos aqui
// convertiria un acceso valido en un "enlace caducado" sin motivo.
var destino = '/' + window.location.search + window.location.hash;
document.getElementById('ir').setAttribute('href', destino);
window.location.replace(destino);
</script>
</body>
